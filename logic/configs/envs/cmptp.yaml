# =============================================================================
# Capacitated Multi-vehicle Profitable Tour Problem (CMPTP) Configuration
# =============================================================================
# Waste-collecting routing WITH vehicle capacity constraints.
#
# Combines:
#   - PTP: Waste/profit collection objective
#   - CVRP: Capacity constraints
#
# Realistic variant where vehicle has limited capacity and must return
# to depot to empty before continuing collection.
#
# Benchmark: Standard OR problem for testing capacity-aware algorithms.
# =============================================================================

name: "cmptp" # Environment identifier
mean: 0.0
variance: 0.0

# =============================================================================
# Capacity Constraint
# =============================================================================
# Vehicle capacity is not set here. Instances generated on the fly take the simulator's
# capacity for the graph's area and waste type (percent of a full bin divided by 100), and
# datasets built by gen_data carry the same value, e.g. Rio Maior plastic:
# 3500 kg / (2.5 * 19 kg per bin) = 73.68 bins. Set 'capacity:' only to override it.

# ===========================================================================
# Curriculum Learning
# ===========================================================================
# The first entry is also used for single-stage training.
# Each entry may include a 'reward:' block to override objective weights.
# Without focus_graph and load_dataset the instances are random points in the unit square,
# not the real network. The datasets are built with:
#   python main.py gen_data data.problem=cmptp data.data_distributions=[emp] \
#     data.dataset_type=train_time data.data_dir=datasets data.name=time data.seed=42 \
#     data.graphs=[{num_loc:50,n_samples:12800,focus_size:12800,n_days:31,...}]
curriculum_graphs:
  - num_loc: 50
    area: "riomaior"
    waste_type: "plastic"
    vertex_method: "mmn"
    distance_method: "gmaps"
    focus_size: 12800
    focus_graph: "graphs_50V_1N_plastic.json"
    dm_filepath: "gmaps_distmat_plastic[riomaior].csv"
    load_dataset: "data/datasets/cmptp/cmptp50_emp_time31_seed42.td"
    n_days: 31
    n_samples: 12800
    start_day: 0
    # Instance i starts with (i mod 10) + 1 days of waste in its bins. With one day's waste
    # everywhere, a tour never pays (about 66 EUR of waste against at least 65 km to reach
    # the nearest bin and return), so the policy learned to stay at the depot before it saw
    # bins worth collecting. A nearest-neighbour tour breaks even at about 3 days of waste.
    init_accumulation_days: 10
    # At the end of each epoch half of the instances are redrawn to 1-10 days of waste; the
    # other half follow the policy's own collections. Without it every instance falls back
    # to one day of waste as soon as the policy collects daily, and the policy then learns
    # to stay home whatever the bins hold (runs version_14 and version_17).
    state_refresh_fraction: 0.5

    # =========================================================================
    # Objective Function Weights
    # =========================================================================
    # Objective: maximize (waste_weight × Σ wastes) - (cost_weight × total_distance)
    # Subject to: vehicle capacity constraints
    # Tour length is in road km (dm_filepath). The weights are the simulator's economics for
    # Rio Maior plastic, so the reward is the day's profit in EUR:
    #   revenue: 0.5837 EUR/kg x 47.5 kg per full bin = 27.7 EUR per bin fill
    #   cost:    1 EUR/km
    # A day brings about 2.4 bin fills (66 EUR) and the depot is about 51 km from the bins,
    # so one day's waste does not pay for a tour; two or more do.
    # Do not scale both weights down: the entropy bonus (rl.entropy_weight x entropy summed
    # over the route, about 5 for a 50-bin route) then outweighs the reward and the policy
    # never learns to stop.
    reward:
      cost_weight: 1.0      # Weight for travel distance (EUR per road km).
      waste_weight: 27.7    # Weight for waste collection (EUR per unit of bin fill).
      overflow_penalty: 1.0 # Penalty factor for overflows.

# ===========================================================================
# Evaluation Graphs
# ===========================================================================
# Each entry may include a 'reward:' block to evaluate under different weights.
eval_graphs:
  - num_loc: 50
    area: "riomaior"
    waste_type: "plastic"
    vertex_method: "mmn"
    distance_method: "gmaps"
    focus_size: 512
    focus_graph: "graphs_50V_1N_plastic.json"
    dm_filepath: "gmaps_distmat_plastic[riomaior].csv"
    load_dataset: "data/datasets/cmptp/cmptp50_emp_val31_seed43.td"
    n_days: 1
    n_samples: 512
    start_day: 0
    # Validate on the same spread of bin states, so the best checkpoint has to stay home
    # when a tour does not pay and collect when it does.
    init_accumulation_days: 10
