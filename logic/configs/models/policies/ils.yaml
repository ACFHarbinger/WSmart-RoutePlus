# @package _global_

# =============================================================================
# ILS (Iterated Local Search) Expert Policy Configuration for RL Training
# =============================================================================
# PURPOSE:
#   Configuration for using Iterated Local Search as expert policy in
#   Imitation Learning or Adaptive Imitation Learning.
#
# USAGE:
#   python main.py train rl.imitation.policy_config=tasks/policies/rl/ils
# =============================================================================

_target_: logic.src.configs.policies.routing.meta_heuristics.ils.ILSConfig

# Same fields as the simulator's ILS (ILSConfig): perturbation + five low-level
# heuristics. engine, packing and route_improvement are simulator-only and ignored.

time_limit: 30.0
n_restarts: 30
inner_iterations: 20
n_removal: 2
n_llh: 5
perturbation_strength: 0.15
profit_aware_operators: false
