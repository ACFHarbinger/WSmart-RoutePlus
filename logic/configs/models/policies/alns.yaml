# @package _global_

# =============================================================================
# ALNS Expert Policy Configuration for RL Training
# =============================================================================
# PURPOSE:
#   Configuration for using Adaptive Large Neighborhood Search (ALNS) as
#   expert policy in Imitation Learning or Adaptive Imitation Learning.
#
# USAGE:
#   python main.py train rl.imitation.policy_config=tasks/policies/rl/alns
# =============================================================================

_target_: logic.src.configs.policies.alns.ALNSConfig

# Same fields as the simulator's ALNS (ALNSConfig); packing, route_improvement
# and engine are simulator-only and ignored by the vectorised expert.

time_limit: 30.0
# Maximum wall-clock seconds
max_iterations: 5000
# Destroy-repair iterations
reaction_factor: 0.1
segment_size: 100
# Adaptive weight update (Ropke & Pisinger 2006)
xi: 0.4
max_removal_cap: 100
# Removal size upper bound: min(cap, xi * n)
noise_factor: 0.025
worst_removal_randomness: 3.0
shaw_randomization: 6.0
regret_pool: regret234
sigma_1: 33.0
sigma_2: 9.0
sigma_3: 13.0
profit_aware_operators: true
extended_operators: false
# acceptance_criterion keeps the simulator default
