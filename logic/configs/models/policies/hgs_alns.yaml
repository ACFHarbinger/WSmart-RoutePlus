# @package _global_

# =============================================================================
# HGS-ALNS Hybrid Expert Policy Configuration for RL Training
# =============================================================================
# PURPOSE:
#   Configuration for using HGS-ALNS hybrid as expert policy in Imitation
#   Learning or Adaptive Imitation Learning.
#
# USAGE:
#   python main.py train rl.imitation.policy_config=tasks/policies/rl/hgs_alns
# =============================================================================

_target_: logic.src.configs.policies.routing.meta_heuristics.hgs_alns.HGSALNSConfig

# Same fields as the simulator's HGS-ALNS (HGSALNSConfig): HGS with ALNS
# education. packing and route_improvement are simulator-only and ignored.

time_limit: 30.0
profit_aware_operators: false
hgs:
  _target_: logic.src.configs.policies.routing.meta_heuristics.hgs.HGSConfig
  time_limit: 30.0
alns:
  _target_: logic.src.configs.policies.routing.meta_heuristics.alns.ALNSConfig
  max_iterations: 50
  # Destroy-repair cycles of each education
