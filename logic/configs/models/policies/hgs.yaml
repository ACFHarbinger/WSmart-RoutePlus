# @package _global_

# =============================================================================
# HGS Expert Policy Configuration for RL Training
# =============================================================================
# PURPOSE:
#   Configuration for using Hybrid Genetic Search (HGS) as expert policy
#   in Imitation Learning or Adaptive Imitation Learning.
#
# USAGE:
#   python main.py train rl.imitation.policy_config=tasks/policies/rl/hgs
# =============================================================================

_target_: logic.src.configs.policies.routing.meta_heuristics.hgs.HGSConfig

# Same fields as the simulator's HGS (HGSConfig); packing, route_improvement,
# engine and the acceptance-criterion telemetry are simulator-only and ignored.

time_limit: 30.0
# Maximum wall-clock seconds (0 = unlimited)
restart_timer: 60.0
mu: 25
# Minimum population size
n_offspring: 40
# Offspring generated before survivor selection
nb_elite: 4
nb_close: 5
n_iterations_no_improvement: 20000
crossover_rate: 1.0
mutation_rate: 1.0
local_search_iterations: 500
nb_granular: 20
max_vehicles: 0
# Maximum number of vehicles (0 = unlimited)
profit_aware_operators: true
