# @package _global_

# =============================================================================
# HVPL Expert Policy Configuration for RL Training
# =============================================================================
# PURPOSE:
#   Configuration for using Hybrid Volleyball Premier League (HVPL) as expert
#   policy in Imitation Learning or Adaptive Imitation Learning.
#
# USAGE:
#   python main.py train rl.imitation.policy_config=tasks/policies/rl/hvpl
# =============================================================================

_target_: logic.src.configs.policies.hvpl.HVPLConfig

# Same fields as the simulator's Hybrid VPL (HVPLConfig); packing and
# route_improvement are simulator-only and ignored. aco_params / alns_params keep
# the simulator defaults (one construction per call, 100 ALNS coaching cycles).

time_limit: 30.0
n_teams: 30
# Number of teams (solutions) in the league
max_iterations: 100
# Number of league seasons
substitution_rate: 0.2
# Fraction of weakest teams replaced by passive teams per season
crossover_rate: 0.8
mutation_rate: 0.1
elite_size: 3
aco_init_iterations: 50
# ACO constructions used to initialise each league
profit_aware_operators: false
