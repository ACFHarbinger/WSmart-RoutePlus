# @package _global_

# =============================================================================
# RLS (Random Local Search) Expert Policy Configuration for RL Training
# =============================================================================
# PURPOSE:
#   Configuration for using Random Local Search as expert policy in
#   Imitation Learning or Adaptive Imitation Learning.
#
# USAGE:
#   python main.py train rl.imitation.policy_config=tasks/policies/rl/rls
# =============================================================================

_target_: logic.src.configs.policies.other.route_improvement.RandomLocalSearchPostConfig

# Same fields as the simulator's random local search route improver
# (RandomLocalSearchPostConfig).

iterations: 1000
# Number of operator applications
time_limit: 30.0
seed: 42
params:
  two_opt: 0.2
  two_opt_star: 0.2
  swap: 0.15
  swap_star: 0.15
  relocate: 0.15
  three_opt: 0.1
# Operator selection probabilities (normalised internally)
