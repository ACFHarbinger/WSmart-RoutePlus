# @package _global_

# =============================================================================
# ACO (Ant Colony Optimization) Expert Policy Configuration for RL Training
# =============================================================================
# PURPOSE:
#   Configuration for using Ant Colony Optimization (HH-ACO, KS-ACO) as
#   expert policy in Imitation Learning or Adaptive Imitation Learning.
#
# USAGE:
#   python main.py train rl.imitation.policy_config=tasks/policies/rl/aco
# =============================================================================

_target_: logic.src.configs.policies.routing.meta_heuristics.aco_ks.KSparseACOConfig

# Same fields as the simulator's K-Sparse ACO (KSparseACOConfig); packing and
# route_improvement are simulator-only and ignored by the vectorised expert.

n_ants: 20
# Number of ants in the colony
max_iterations: 50
# Maximum number of ACO iterations
time_limit: 30.0
# Maximum wall-clock seconds
alpha: 1.0
# Pheromone importance factor
beta: 2.0
# Heuristic (distance) importance factor
rho: 0.1
# Pheromone evaporation rate
tau_0: 1.0
# Initial pheromone level (null = derived from a nearest-neighbour tour)
tau_min: 0.01
tau_max: 10.0
# Max-min pheromone bounds
q0: 0.9
# Probability of exploitation vs exploration (ACS-style)
k_sparse: 15
# Number of nearest neighbours each ant may move to
local_search: true
local_search_iterations: 500
# Local search after construction
elitist_weight: 1.0
profit_aware_operators: false
