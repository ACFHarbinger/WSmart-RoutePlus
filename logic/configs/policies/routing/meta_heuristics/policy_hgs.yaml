hgs:
  custom:
    # time_limit is only a guard; the iteration budget ends the run, so results do not depend on machine speed.
    time_limit: 600.0
    max_iterations: 650
    restart_timer: 60
    n_iterations_no_improvement: 20000
    mu: 25
    lambda_param: 40
    nb_elite: 4
    nb_close: 5
    target_feasible: 0.2
    repair_probability: 0.5
    crossover_rate: 1.0
    initial_penalty_capacity: 1.0
    penalty_increase: 1.2
    penalty_decrease: 0.85
    profit_aware_operators: true
    engine: custom
    packing:
      other/packing/pk_last_minute.yaml:
      - last_minute_cf70
      - last_minute_cf90
    route_improvement:
      other/route_improvement/ri_cls.yaml:
      - default
    acceptance_criteria:
      other/acceptance_criteria/ac_oi.yaml:
      - oi
