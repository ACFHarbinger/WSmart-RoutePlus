alns:
  custom:
    # time_limit is only a guard; the iteration budget ends the run, so results do not depend on machine speed.
    time_limit: 600.0
    max_iterations: 4500
    reaction_factor: 0.1
    xi: 0.4
    extended_operators: false
    profit_aware_operators: true
    engine: custom
    packing:
      other/packing/pk_last_minute.yaml:
      - last_minute_cf70
      - last_minute_cf90
    route_improvement:
      other/route_improvement/ri_cls.yaml:
      - default
    acceptance_criteria:
      other/acceptance_criteria/ac_bmc.yaml:
      - bmc_calibrated
    acceptance_criterion:
      method: bmc
      params:
        initial_temp: 0
        alpha: 0.995
        start_temp_control: 0.05
