hgs_alns:
  custom:
    time_limit: 60
    profit_aware_operators: false
    packing:
      other/packing/pk_lookahead.yaml:
      - default
    route_improvement: []
    hgs:
      time_limit: 60
      mu: 25
      lambda_param: 40
      nb_elite: 4
      nb_close: 5
      nb_granular: 20
      target_feasible: 0.2
      n_iterations_no_improvement: 20000
      mutation_rate: 1.0
      repair_probability: 0.5
      crossover_rate: 1.0
      max_vehicles: 0
      local_search_iterations: 100
      initial_penalty_capacity: 1.0
      penalty_increase: 1.2
      penalty_decrease: 0.85
      engine: custom
      restart_timer: 60
    alns:
      reaction_factor: 0.1
      time_limit: 60
      engine: custom
      max_iterations: 100
      xi: 0.2
      acceptance_criterion:
        method: bmc
        params:
          initial_temp: 100.0
          alpha: 0.95
