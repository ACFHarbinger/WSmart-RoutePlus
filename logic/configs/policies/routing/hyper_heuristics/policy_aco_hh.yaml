aco_hh:
  custom:
    n_ants: 10
    alpha: 1.0
    beta: 2.0
    rho: 0.5
    tau_0: 1.0
    stagnation_limit: 10
    max_iterations: 50
    elitism_ratio: 0.5
    # as in the reported runs: no local-search polish, the best ant deposits like the others
    local_search: false
    elitist_weight: 1.0
    # time_limit is only a guard; the iteration budget ends the run, so results do not depend on machine speed.
    time_limit: 600.0
    sequence_length: null
    Q: 1.0
    lambda_val: 1.0001
    use_dynamic_lambda: true
    operators: null
    profit_aware_operators: true
    packing:
      other/packing/pk_last_minute.yaml:
      - last_minute_cf70
      - last_minute_cf90
    route_improvement:
      other/route_improvement/ri_cls.yaml:
      - default
