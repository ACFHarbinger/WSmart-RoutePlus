swc_tcf:
  gurobi:
    Omega: 0.1
    psi: 1
    engine: gurobi
    framework: gurobi
    # Directed two-commodity flow: each used arc costs its own directed distance (owner ruling
    # 2026-10-26; the paper's results use it). formulation: paper is the undirected published model.
    formulation: directed
    # A day that ends with no incumbent is re-solved once with 9 x 60 s = 540 s, as the paper states.
    no_solution_time_factor: 9.0
    packing:
      other/packing/pk_last_minute.yaml:
      - last_minute_cf70
      - last_minute_cf90
    time_limit: 60.0
    route_improvement:
      other/route_improvement/ri_cls.yaml:
      - default
