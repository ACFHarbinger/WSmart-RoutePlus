hgs_rr:
  custom:
    time_limit: 60.0
    max_vehicles: 0
    population_size: 50
    elite_size: 10
    n_iterations_no_improvement: 20000
    mutation_rate: 0.3
    crossover_rate: 0.7
    no_improvement_threshold: 20
    survivor_threshold: 2.0
    neighbor_list_size: 10
    min_removal_pct: 0.1
    max_removal_pct: 0.4
    noise_factor: 0.015
    reaction_factor: 0.1
    decay_parameter: 0.95
    destroy_operators:
    - random_removal
    - worst_removal
    - cluster_removal
    - shaw_removal
    - string_removal
    operator_decay_rate: 0.95
    repair_operators:
    - greedy_insertion
    - regret_2_insertion
    - regret_k_insertion
    - greedy_insertion_with_blinks
    score_sigma_1: 33.0
    score_sigma_2: 9.0
    score_sigma_3: 3.0
    profit_aware_operators: false
    engine: custom
    packing:
      other/pk_lookahead.yaml:
      - default
    route_improvement: []
