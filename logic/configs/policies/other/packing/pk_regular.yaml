# Longer periods (k = 7 and 10), run on their own (launch_campaign --configs, PERIOD_PACKING): the best fixed
# schedule under the Empirical process was the longest of k = 3 to 5.
regular_lvl7:
  strategy: regular
  threshold: 7
regular_lvl10:
  strategy: regular
  threshold: 10
regular_tr_lvl7:
  strategy: regular
  threshold: 7
  min_fill: 15
regular_tr_lvl10:
  strategy: regular
  threshold: 10
  min_fill: 15
# Delayed calendars: the first collection is on day k (days k, 2k, ...), so every scheduled
# collection, including the first, gathers k days of deposits when the run starts from empty bins.
regular_lvl3_delayed:
  strategy: regular
  threshold: 3
  first_day: 3
regular_lvl4_delayed:
  strategy: regular
  threshold: 4
  first_day: 4
regular_lvl5_delayed:
  strategy: regular
  threshold: 5
  first_day: 5
regular_tr_lvl3_delayed:
