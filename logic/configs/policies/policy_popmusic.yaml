popmusic:
  custom:
    subproblem_size: 3
    k_prox: 10
    seed_strategy: lifo
    max_iterations: 100
    base_solver: alns
    base_solver_config:
      fast_tsp:
        time_limit: 1.0
      alns:
        time_limit: 1.0
        max_iterations: 1000
        start_temp: 100
        cooling_rate: 0.995
        reaction_factor: 0.1
        min_removal: 1
        max_removal_pct: 0.3
      hgs:
        time_limit: 1.0
        mu: 25
        lambda_param: 40
        nb_elite: 4
        nb_close: 5
        nb_granular: 20
        n_iterations_no_improvement: 20000
        local_search_iterations: 500
        target_feasible: 0.2
        mutation_rate: 1.0
        crossover_rate: 1.0
        repair_probability: 0.5
        initial_penalty_capacity: 1.0
        penalty_increase: 1.2
        penalty_decrease: 0.85
        use_cross_exchange: false
        use_lambda_interchange: false
        lambda_max: 2
        use_ejection_chains: false
    cluster_solver: fast_tsp
    cluster_solver_config:
      fast_tsp:
        time_limit: 0.1
      alns:
        time_limit: 1.0
        max_iterations: 1000
        start_temp: 100
        cooling_rate: 0.995
        reaction_factor: 0.1
        min_removal: 1
        max_removal_pct: 0.3
      hgs:
        time_limit: 1.0
        mu: 25
        lambda_param: 40
        nb_elite: 4
        nb_close: 5
        nb_granular: 20
        n_iterations_no_improvement: 20000
        local_search_iterations: 500
        target_feasible: 0.2
        mutation_rate: 1.0
        crossover_rate: 1.0
        repair_probability: 0.5
        initial_penalty_capacity: 1.0
        penalty_increase: 1.2
        penalty_decrease: 0.85
        use_cross_exchange: false
        use_lambda_interchange: false
        lambda_max: 2
        use_ejection_chains: false
    initial_solver: pmedian
    profit_aware_operators: false
    packing:
      other/pk_lookahead.yaml:
      - default
    route_improvement: []
