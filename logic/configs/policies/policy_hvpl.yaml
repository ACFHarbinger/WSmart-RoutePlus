hvpl:
  custom:
    n_teams: 10
    max_iterations: 50
    substitution_rate: 0.2
    crossover_rate: 0.8
    mutation_rate: 0.1
    elite_size: 3
    aco_init_iterations: 50
    time_limit: 60.0
    aco:
      n_ants: 10
      k_sparse: 10
      alpha: 1.0
      beta: 2.0
      rho: 0.1
      q0: 0.9
      tau_0: 1.0
      tau_min: 0.001
      tau_max: 10.0
      max_iterations: 1
      local_search: false
      local_search_iterations: 0
      elitist_weight: 1.0
      time_limit: 30.0
    alns:
      max_iterations: 100
      reaction_factor: 0.5
      time_limit: 60.0
      acceptance_criterion:
        method: bmc
        params:
          initial_temp: 100.0
          alpha: 0.95
          start_temp_control: 0.05
      xi: 0.2
    profit_aware_operators: true
    packing:
      other/pk_lookahead.yaml:
      - default
    route_improvement: []
