# General Configuration
task: test_sim
seed: 42

# Simulation Configuration
sim:
  cpu_cores: 0
  n_vehicles: 0
  no_cuda: false
  problem: "ptp" # ptp | cptp | cptptc
  shift_hours: 7.0 # CPTPTC per depot-to-depot trip, including return and service
  avg_speed_kmh: 35.0 # Uniform fallback for every bin and depot leg
  service_time_h: 0.025
  time_windows: null # Optional routing time windows: CSV/Excel path or [start_day, days_after, interval_between]
  # CPTPTC keeps this file's graph/policy lists; only the problem tag changes.
  #   python main.py test_sim sim.problem=cptptc
  # Do not flip the committed default -- the paper's 30-day factorial is ptp.
  output_dir: "outputs/simulations"
  run_name: "lm_cls"
  checkpoint_dir: "checkpoints"
  checkpoint_days: 0
  # Schema defaults are days=31 and n_samples=1. The day loop reads the graph
  # fields below, so an override of sim.days / sim.n_samples has to land there.
  # 30 keeps the paper horizon; seed follows the root seed the CLI sets.
  days: 30
  n_samples: 1
  seed: ${seed}
  data_distribution: "emp"

  # Relative to ROOT/data/simulator/
  graph:
    tm_filepath: null # ID-labelled CSV; basename resolves under data/simulator/time_matrix
    time_matrix_unit: seconds # seconds | minutes | hours; internal times are hours
    n_days: ${sim.days}
    num_loc: 350
    n_samples: ${sim.n_samples}
    area: "figueiradafoz"
    waste_type: "plastic"
    distance_method: "file"
    dm_filepath: "gmaps_distmat_${sim.graph.waste_type}[${sim.graph.area}].csv"
    focus_graph: "graphs_${sim.graph.num_loc}V_1N_${sim.graph.waste_type}.json"
    load_dataset: "data/simulator/datasets/${sim.graph.area}${sim.graph.num_loc}_${sim.data_distribution}_wsr${sim.graph.n_days}_N${sim.graph.n_samples}_seed${sim.seed}.npz"
    save_updated_dm: "gmaps_distmat.csv"

  # Policies to run
  policies:
    - hgs_adc: ${p.hgs_adc.hgs_adc}
    - abc: ${p.abc.abc}
    - abpc_hg: ${p.abpc_hg.abpc_hg}
