#          flag. Loads shift_hours/avg_speed_kmh/service_time_h via
#          load_temporal_params() in InitializingState and enforces both
#          capacity and T_max after improvement and before collection.
#          Configure budgets on sim and the matrix path on sim.graph.
# =============================================================================

