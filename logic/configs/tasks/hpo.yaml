# @package _global_
# =============================================================================
# Hyperparameter Optimization (HPO) Task Configuration
# =============================================================================
# Configuration for automated hyperparameter search using Optuna/DEHB.
# Used by: python main.py hp_optim
# CTOP:    python main.py task=hpo envs@hpo.env=ctop
#
# Searches over model/training hyperparameters to find optimal configurations.
# =============================================================================

defaults:
  - /envs@hpo.env: cwcvrp
  - _self_
  - override /tracking: hpo

# =============================================================================
# General Configuration
# =============================================================================
task: hpo
seed: 42 # Random seed for reproducibility

# =============================================================================
# HPO Configuration
# =============================================================================
hpo:
  # HPO Method
  method:
    "dehbo" # Hyperparameter optimization method. Options:
    # - "dehbo": Differential Evolution Hyperband Optimization (faster)
    # - "optuna": Optuna with TPE sampler (more flexible)
    # - "random": Random search (baseline)

  metric:
    "both" # Optimization metric. Options:
    # - "cost": Minimize total route cost
    # - "reward": Maximize collected reward/waste
    # - "both": Multi-objective (cost + reward)
    # ctop's additive "time" KPI is not a selectable HPO metric here; the
    # search still ranks on cost/reward. A time-budget objective would need
    # a pipeline change, not just a YAML key.

  # Search Budget
  n_trials:
    25 # Number of hyperparameter configurations to try.
    # Range: 10-100. More trials = better but slower.
    # 25 is good balance for initial search.

  n_epochs_per_trial:
    7 # Training epochs per configuration.
    # Reduced from full training for faster search.
    # 7 epochs is enough to distinguish good/bad configs.

  fevals: 25 # Function evaluations (alias for n_trials)

  # Search Space
  search_space:
    rl.entropy_weight:
      type: float
      low: 0.0
      high: 0.1
    optim.lr:
      type: float
      low: 0.00001
      high: 0.001
      log: true
    # Example: Integer parameter
    # model.encoder.n_layers:
    #   type: int
    #   low: 2
    #   high: 6
    # Example: Categorical parameter
    # scale_prior:
    #   type: categorical
    #   choices: [0.1, 1.0, 10.0]

  # =============================================================================
  # Differential Evolution / Genetic Algorithm Parameters
  # =============================================================================
  # Used when method="dehbo"

  eta:
    5.0 # Hyperband eta parameter (resource allocation aggressiveness).
    # Higher = more aggressive pruning of bad configurations.

  n_pop:
    20 # Population size for evolutionary algorithms.
    # Larger = more diverse but slower.

  mutpb:
    0.3 # Mutation probability (0.0-1.0).
    # Higher = more exploration, lower = more exploitation.
    # 0.3 is standard.
