# =============================================================================
# WSmart-Route Main Configuration File
# =============================================================================
# This is the root Hydra configuration that composes all other config groups.
#
# Composition Order (Hydra defaults list):
#   1. _self_ - This file's settings (base layer)
#   2. tasks/* - Task-specific configs (train, eval, test_sim, gen_data, hpo, meta_train)
#              Each task config declares its own envs group entry.
#   3. model/* - Neural model architectures (am, tam, deep_decoder, ptr, symnco, moe)
#
# Override from CLI:
#   python main.py train models=tam envs@train.env=ptp seed=1234
#   python main.py train envs@train.env=tcmvptp
#   python main.py eval models.embed_dim=256
#
# See docs/HYDRA_GUIDE.md for full override syntax and multi-run examples.
# =============================================================================

defaults:
  - _self_
  - tracking: train
  - tasks: train

# =============================================================================
# Global Settings
# =============================================================================

seed: 42
task: "train"
device: "cuda"

# =============================================================================
# Training Defaults (Overridden by tasks/train.yaml)
# =============================================================================
train:
  callbacks:
    - display:
        _target_: logic.src.pipeline.callbacks.pytorch.training_display.TrainingDisplayCallback
        metric_keys: ["train/reward", "val/reward"]
        chart_title: "📈 Training Progress"
        history_length: null
