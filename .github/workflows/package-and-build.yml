name: Release — Manifest Check & Package Build

# Manifest-driven release pipeline (WP-02, owner ruling Q-10a: the package is
# built from main by logic/release.yaml; the algo-export branch/patch flow is
# retired). The manifest uses registry keys, not the old BB/BC/BPC acronyms.

on:
  push:
    branches:
      - main
    paths:
      - "logic/release.yaml"
      - "logic/package/build_release.py"
      - "logic/pyproject.toml"
      - ".github/workflows/package-and-build.yml"
  pull_request:
    paths:
      - "logic/release.yaml"
      - "logic/package/build_release.py"
      - "logic/pyproject.toml"
      - ".github/workflows/package-and-build.yml"
  workflow_dispatch:

jobs:
  release-check:
    name: Release manifest check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: python -m pip install --quiet pyyaml

      - name: Manifest check (every released key is registered)
        run: python logic/package/build_release.py --check

  release-build:
    name: Release build and torch-free smoke
    needs: release-check
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: python -m pip install --quiet pyyaml

      - name: Build the release tree from the manifest
        run: python logic/package/build_release.py --build release/

      - name: Staged-tree smoke test
        run: python logic/package/build_release.py --smoke release/

      - name: Torch-free installed-package smoke test (Q-16a)
        run: |
          python -m venv /tmp/relvenv
          /tmp/relvenv/bin/pip install --quiet --upgrade pip
          /tmp/relvenv/bin/pip install --quiet --no-deps release/
          /tmp/relvenv/bin/pip install --quiet \
            numpy pandas scipy pyyaml hydra-core hydra-colorlog omegaconf \
            loguru rich tqdm networkx scikit-learn python-dotenv joblib \
            cryptography requests openpyxl protobuf
          /tmp/relvenv/bin/python - <<'PY'
          import sys

          assert "torch" not in sys.modules
          from logic.src.policies.packing.base.selection_registry import PackingRegistry
          from logic.src.utils.registry import ACCEPTANCE, IMPROVEMENT, PACKING

          for key in ("last_minute", "service_level", "lookahead", "regular"):
              assert PACKING.get(key) is not None, key
          assert IMPROVEMENT.get("classical_local_search") is not None
          assert IMPROVEMENT.get("fast_tsp") is not None
          assert ACCEPTANCE.get("bmc") is not None
          assert ACCEPTANCE.get("oi") is not None
          assert PACKING.get("revenue_threshold") is None, "unreleased key resolves"

          PACKING.create("last_minute")
          PACKING.create("regular")
          ACCEPTANCE.create("bmc", initial_temp=100.0, alpha=0.995)
          ACCEPTANCE.create("oi")
          IMPROVEMENT.create("classical_local_search")
          IMPROVEMENT.create("fast_tsp")

          assert "torch" not in sys.modules, "torch was imported on the classical path"
          print("torch-free installed-package smoke OK")
          PY

      # NOTE: running the release test set (logic/test/release_tests.txt,
      # collection-validated by the build) becomes a gate once the P-06 test
      # pruning lands with the config and simulator work packages: some kept
      # tests assert the dev tree's full registry, which the filtered release
      # registry intentionally violates.

      - name: Upload the release tree
        uses: actions/upload-artifact@v4
        with:
          name: wsmart-route-release
          path: release/
          retention-days: 14
