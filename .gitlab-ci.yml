# =============================================================================
# GitLab CI equivalent of the four GitHub workflows (issue #57).
#
# Mapping (keep in sync with .github/workflows/):
#   .github/workflows/ci.yml              -> jobs quality-checks, test-e2e,
#                                            test-integration,
#                                            test-fast-unit, test-slow-unit
#   .github/workflows/docs.yml            -> job docs (the GitHub Pages deploy
#                                            has no mirror equivalent; the
#                                            built html is kept as an artifact)
#   .github/workflows/sync-to-public.yml  -> job sync-to-public (manual)
#   .github/workflows/package-and-build.yml -> jobs release-check, release-build
#                                            (manifest-driven; the algo-export
#                                            flow is retired, Q-10a)
#
# Differences against GitHub Actions, by design:
#   * The release jobs have no inputs; the manifest (logic/release.yaml) is
#     the single source of truth.
#   * The Codecov upload and the GitHub Pages deploy are GitHub-only; the
#     coverage report and the built docs are exposed as artifacts instead.
#   * Submodules: `GIT_SUBMODULE_STRATEGY` is off by default because the
#     Overleaf submodule (git.overleaf.com) cannot be fetched by a mirror
#     runner. Jobs that need the GitHub-hosted submodules set
#     GIT_SUBMODULE_STRATEGY: recursive, a runtime-only path allowlist and
#     pre-checkout token rewriting; set the
#     PUBLIC_REPO_TOKEN CI/CD variable (masked, protected) to a PAT with read
#     access to the two private GitHub repos.
# =============================================================================

workflow:
  rules:
    # push to main / merge request / manual web pipeline (= workflow_dispatch)
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

stages: [quality, test, docs, deploy, release]

default:
  # Full (non-slim) image: `make` is required by the docs job.
  image: python:3.11
  interruptible: true

variables:
  UV_LINK: "https://astral.sh/uv/install.sh"
  # Test jobs pin the interpreter exactly like actions/setup-python@v5.
  PY_VERSION: "3.10"

# --- shared script fragments -------------------------------------------------

.setup_uv: &setup_uv |
  curl -LsSf "$UV_LINK" | sh
  export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
  uv --version

# Rewrite the private GitHub submodule URLs with the CI token, when present.
.submodule_auth: &submodule_auth |
  if [ -n "$PUBLIC_REPO_TOKEN" ]; then
    git config --global url."https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
  fi

# =============================================================================
# .github/workflows/ci.yml — Job 1: quality-checks
# =============================================================================
quality-checks:
  stage: quality
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  variables:
    GIT_SUBMODULE_STRATEGY: "none"   # static checks need no submodules
  script:
    - *setup_uv
    - uv sync --all-packages --all-extras --all-groups --python "$PY_VERSION"
    - uv run pre-commit run --all-files
    # HPO job key-liveness check (P-56)
    - uv run python tools/check_hpo_jobs.py --check
    - uv run python tools/check_params_refs.py
    - uv run ruff check . --fix
    # Visibility first, mirroring continue-on-error on GitHub.
    - uv run pip-audit || true
    - uv run mypy . || true

# =============================================================================
# ci.yml — Jobs 2-5: the four test suites (all need the GitHub submodules)
# =============================================================================
.test-base:
  stage: test
  needs: [quality-checks]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_PATHS: packages/wsmart_bin_analysis
    GIT_DEPTH: "1"
  hooks:
    pre_get_sources_script:
      - *submodule_auth
  before_script:
    - *setup_uv
  script:
    - uv sync --all-packages --all-extras --all-groups --python "$PY_VERSION"
    - uv run pytest -m "$PYTEST_MARKERS"

test-e2e:
  extends: .test-base
  variables:
    PYTEST_MARKERS: "e2e"

test-integration:
  extends: .test-base
  variables:
    PYTEST_MARKERS: "integration"

test-fast-unit:
  extends: .test-base
  variables:
    PYTEST_MARKERS: "unit and fast"
  script:
    - uv sync --all-packages --all-extras --all-groups --python "$PY_VERSION"
    - uv run pytest -m "unit and fast" --cov=logic/src --cov-report=xml --cov-report=term-missing
    # Codecov is GitHub-only; keep the report as an artifact.
  artifacts:
    when: always
    paths:
      - coverage.xml
    expire_in: 1 week

test-slow-unit:
  extends: .test-base
  variables:
    PYTEST_MARKERS: "unit and slow"

# =============================================================================
# .github/workflows/docs.yml — build the Sphinx documentation.
# The peaceiris/actions-gh-pages deploy publishes to GitHub Pages, which a
# mirror runner cannot do; the built html is kept as an artifact instead.
# =============================================================================
docs:
  stage: docs
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  variables:
    GIT_SUBMODULE_STRATEGY: "none"
  script:
    - *setup_uv
    - uv sync --all-packages --all-extras --all-groups --python "$PY_VERSION"
    - cd logic/docs
    - uv run make html
  artifacts:
    paths:
      - logic/docs/build/html
    expire_in: 1 week

# =============================================================================
# .github/workflows/sync-to-public.yml — mirror to the public GitHub repo.
# GitHub guards with `github.repository == 'ACFHarbinger/WSmart-Route'`;
# here the canonical repo sets the (protected, masked) SYNC_TO_PUBLIC
# variable to "true"; mirrors leave it unset and the job is skipped.
# =============================================================================
sync-to-public:
  stage: deploy
  rules:
    - if: '$SYNC_TO_PUBLIC == "true" && $CI_COMMIT_BRANCH == "main"'
      when: manual
  variables:
    GIT_SUBMODULE_STRATEGY: "none"
    GIT_DEPTH: "0"          # full history, like fetch-depth: 0
  script:
    - git config --global user.name "gitlab-ci[bot]"
    - git config --global user.email "gitlab-ci[bot]@users.noreply.gitlab.com"
    # Remove the private directories from the public copy.
    - |
      REMOVED=0
      if [ -d "bibliography" ]; then git rm -rf --ignore-unmatch bibliography; REMOVED=1; fi
      if [ -d "assets" ]; then git rm -rf --ignore-unmatch assets; REMOVED=1; fi
      if [ "$REMOVED" = "1" ] && ! git diff --cached --quiet; then
        git commit -m "chore: exclude private directories from public sync"
      fi
    - git remote remove public || true
    - git remote add public "https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/ACFHarbinger/WSmart-Simulator.git"
    # GitLab checks out a detached HEAD; push the sanitized commit explicitly.
    - git push public HEAD:refs/heads/main --force

# =============================================================================
# .github/workflows/package-and-build.yml — manifest-driven release build
# (WP-02, Q-10a). The algo-export branch/patch flow is retired; the package is
# built from this branch by logic/release.yaml.
# =============================================================================

release-check:
  stage: release
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  timeout: 15m
  variables:
    GIT_SUBMODULE_STRATEGY: "none"
  script:
    - *setup_uv
    - uv sync --all-packages --frozen --python "3.11"
    - uv run python logic/package/build_release.py --check

release-build:
  stage: release
  needs: [release-check]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
  resource_group: release-build
  timeout: 40m
  variables:
    GIT_SUBMODULE_STRATEGY: "none"
  script:
    - *setup_uv
    - uv sync --all-packages --frozen --python "3.11"
    - uv run python logic/package/build_release.py --build release/
    - uv run python logic/package/build_release.py --smoke release/
    # NOTE: running the release test set becomes a gate once the P-06 test
    # pruning lands (kept tests may assert the dev tree's full registry).
    # Torch-free installed-package smoke test (Q-16a).
    - |
      uv venv /tmp/relvenv --python "3.11"
      /tmp/relvenv/bin/python -m pip install --quiet --no-deps release/
      /tmp/relvenv/bin/python -m pip install --quiet \
        numpy pandas scipy pyyaml hydra-core hydra-colorlog omegaconf loguru \
        rich tqdm networkx scikit-learn python-dotenv joblib cryptography \
        requests openpyxl protobuf
      /tmp/relvenv/bin/python - <<'PY'
      import sys

      assert "torch" not in sys.modules
      from logic.src.policies.packing.base.selection_registry import PackingRegistry  # noqa: F401
      from logic.src.utils.registry import ACCEPTANCE, IMPROVEMENT, PACKING

      for key in ("last_minute", "service_level", "lookahead", "regular"):
          assert PACKING.get(key) is not None, key
      assert IMPROVEMENT.get("classical_local_search") is not None
      assert IMPROVEMENT.get("fast_tsp") is not None
      assert ACCEPTANCE.get("bmc") is not None
      assert ACCEPTANCE.get("oi") is not None
      assert PACKING.get("revenue_threshold") is None, "unreleased key resolves"

      PACKING.create("last_minute")
      PACKING.create("regular")
      ACCEPTANCE.create("bmc", initial_temp=100.0, alpha=0.995)
      ACCEPTANCE.create("oi")
      IMPROVEMENT.create("classical_local_search")
      IMPROVEMENT.create("fast_tsp")

      assert "torch" not in sys.modules, "torch was imported on the classical path"
      print("torch-free installed-package smoke OK")
      PY
  artifacts:
    when: always
    paths:
      - release/
    expire_in: 30 days
